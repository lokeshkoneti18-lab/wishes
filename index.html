<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b19">
  <meta name="description" content="A little sky full of birthday wishes for VADINA garu.">
  <title>Happy birthday, VADINA garu</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #071b19;
      --paper: #fff3dc;
      --muted: #f7e8d0;
      --coral: #ff806f;
      --gold: #f0c879;
      --mint: #f2d89e;
    }

    * { box-sizing: border-box; }

    html, body { min-width: 320px; min-height: 100%; margin: 0; }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      overflow-y: auto;
      color: var(--paper);
      background:
        linear-gradient(rgba(7, 27, 25, .48), rgba(7, 27, 25, .62)),
        url("background.png") center center / cover fixed no-repeat;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      content: "";
      opacity: .16;
      background-image: radial-gradient(rgba(255, 248, 236, .62) .7px, transparent .7px);
      background-size: 39px 39px;
      mask-image: linear-gradient(to bottom, #000 0%, transparent 92%);
    }

    #sky {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .scene {
      position: relative;
      z-index: 2;
      display: block;
      min-height: 100svh;
      padding: 38px 24px 26px;
      text-align: center;
    }

    .greeting {
      width: min(100%, 1150px);
      margin: 0 auto;
      padding: 15px 0 25px;
      animation: arrive 1.1s cubic-bezier(.2, .75, .25, 1) both;
    }

    .sparkle {
      display: grid;
      width: 52px;
      height: 52px;
      margin: 0 auto 28px;
      place-items: center;
      border: 1px solid rgba(255, 212, 124, .45);
      border-radius: 50%;
      color: var(--gold);
      font-size: 24px;
      box-shadow: 0 0 38px rgba(255, 212, 124, .12), inset 0 0 18px rgba(255, 212, 124, .08);
      animation: twinkle 3s ease-in-out infinite;
    }

    .eyebrow {
      margin: 0 0 20px;
      color: var(--mint);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(0, 0, 0, .9);
      animation: rise .8s .18s both;
    }

    h1 {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(46px, 8.6vw, 100px);
      font-weight: 400;
      line-height: .98;
      text-wrap: balance;
      animation: rise 1s .3s both;
    }

    h1 .first-line {
      color: var(--paper);
      font-style: italic;
      text-shadow: 0 2px 14px rgba(0, 0, 0, .85);
    }

    h1 .name {
      margin-top: 8px;
      color: var(--gold);
      font-size: clamp(54px, 10.6vw, 124px);
      font-weight: 700;
      line-height: 1.05;
      text-shadow: 0 0 38px rgba(240, 200, 121, .18), 0 2px 16px rgba(0, 0, 0, .8);
    }

    .wish {
      max-width: 460px;
      margin: 24px auto 0;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(17px, 2.2vw, 21px);
      line-height: 1.65;
      text-wrap: balance;
      text-shadow: 0 1px 8px rgba(0, 0, 0, .95);
      animation: rise .9s .52s both;
    }

    .wish em { color: #f4d18c; }

    .memories-label {
      margin: 28px 0 12px;
      color: #f5e4c4;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(0, 0, 0, .95);
      animation: rise .9s .62s both;
    }

    .memories {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 12px;
      width: min(100%, 1060px);
      margin: 0 auto;
      animation: rise .9s .68s both;
    }

    .memory-photo {
      display: block;
      width: 100%;
      height: 190px;
      border: 1px solid rgba(255, 248, 236, .35);
      border-radius: 5px;
      object-fit: cover;
      background: rgba(255, 248, 236, .08);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .24);
      transition: transform .3s ease, box-shadow .3s ease;
    }

    .memory-photo:nth-child(odd) { transform: translateY(5px) rotate(-1deg); }
    .memory-photo:nth-child(even) { transform: translateY(-3px) rotate(1deg); }
    .memory-photo:first-child { object-position: center 10%; }
    .memory-photo:hover { z-index: 1; transform: translateY(-5px) scale(1.035); box-shadow: 0 18px 36px rgba(0, 0, 0, .36); }

    .replay {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 34px;
      padding: 0 21px;
      border: 1px solid rgba(255, 248, 236, .27);
      border-radius: 999px;
      color: var(--paper);
      background: rgba(255, 248, 236, .06);
      font: 600 13px/1 "Trebuchet MS", "Segoe UI", sans-serif;
      cursor: pointer;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
      animation: rise .9s .68s both;
    }

    .replay:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 212, 124, .75);
      background: rgba(255, 248, 236, .12);
    }

    .replay:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    .replay:disabled { cursor: not-allowed; opacity: .55; }
    .replay-icon { color: var(--gold); font-size: 19px; line-height: .8; }

    .footer-note {
      margin: 32px 0 0;
      color: rgba(255, 243, 220, .86);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(0, 0, 0, .95);
      animation: rise .8s .85s both;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(1); box-shadow: 0 0 26px rgba(255, 212, 124, .1); }
      50% { transform: scale(1.07); box-shadow: 0 0 42px rgba(255, 212, 124, .24); }
    }

    @media (max-width: 520px) {
      body {
        background:
          linear-gradient(rgba(7, 27, 25, .48), rgba(7, 27, 25, .62)),
          url("background2.png") center center / cover no-repeat;
      }
      .scene { padding: 25px 20px 24px; }
      .greeting { padding: 12px 0 20px; }
      .sparkle { width: 46px; height: 46px; margin-bottom: 24px; }
      .eyebrow { font-size: 10px; letter-spacing: .17em; }
      h1 { font-size: clamp(43px, 12vw, 62px); }
      h1 .name { font-size: clamp(40px, 12.2vw, 58px); white-space: nowrap; }
      .wish { max-width: 340px; margin-top: 20px; }
      .memories-label { margin-top: 25px; }
      .memories {
        display: flex;
        width: calc(100% + 20px);
        margin-left: -10px;
        gap: 12px;
        overflow-x: auto;
        padding: 3px 10px 14px;
        scroll-snap-type: x mandatory;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 212, 124, .55) transparent;
      }
      .memory-photo { flex: 0 0 145px; height: 182px; scroll-snap-align: center; }
      .replay { margin-top: 27px; }
      .footer-note { font-size: 9px; }
    }

    @media (max-width: 520px) and (max-height: 700px) {
      .scene { padding: 12px 14px 10px; }
      .greeting { padding: 0 0 8px; }
      .sparkle { width: 34px; height: 34px; margin-bottom: 10px; font-size: 18px; }
      .eyebrow { margin-bottom: 8px; font-size: 9px; }
      h1 { font-size: clamp(38px, 11vw, 46px); }
      h1 .name { margin-top: 4px; font-size: clamp(36px, 11.6vw, 44px); }
      .wish { margin-top: 10px; font-size: 15px; line-height: 1.4; }
      .memories-label { margin: 12px 0 7px; font-size: 9px; }
      .memories { gap: 8px; padding: 2px 10px 8px; }
      .memory-photo { flex-basis: 105px; height: 125px; }
      .replay { min-height: 42px; margin-top: 12px; }
      .footer-note { margin-top: 10px; font-size: 8px; }
    }

    @media (min-width: 521px) and (max-width: 900px) {
      .memories { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 720px; }
      .memory-photo { height: 170px; }
    }

    @media (max-height: 650px) and (min-width: 521px) {
      .scene { padding-top: 24px; padding-bottom: 26px; }
      .sparkle { margin-bottom: 17px; }
      .eyebrow { margin-bottom: 13px; }
      .wish { margin-top: 15px; }
      .memories-label { margin-top: 20px; }
      .memory-photo { height: 155px; }
      .replay { margin-top: 21px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <main class="scene">
    <section class="greeting" aria-labelledby="birthday-title">
      <div class="sparkle" aria-hidden="true">&#10022;</div>
      <p class="eyebrow">A little extra magic, just for you</p>
      <h1 id="birthday-title">
        <span class="first-line">Happy birthday</span>
        <span class="name">VADINA garu</span>
      </h1>
      <p class="wish">May your year be full of <em>big joy</em>, beautiful surprises, and all the little things that make you smile.</p>
      <p class="memories-label">A few lovely memories</p>
      <div class="memories" aria-label="Birthday memories">
        <img class="memory-photo" src="WhatsApp Image 2026-11-04 at 11.51.37 (1).jpeg" alt="A couple smiling together beneath a flower arch" loading="lazy">
        <img class="memory-photo" src="WhatsApp Image 2026-11-04 at 11.51.37.jpeg" alt="A couple sharing a seated portrait at their celebration" loading="lazy">
        <img class="memory-photo" src="WhatsApp Image 2026-11-04 at 11.51.39 (1).jpeg" alt="A couple standing together at a celebration" loading="lazy">
        <img class="memory-photo" src="WhatsApp Image 2026-11-04 at 11.51.39.jpeg" alt="A woman in a bright pink outfit at a colorful temple" loading="lazy">
        <img class="memory-photo" src="WhatsApp Image 2026-11-04 at 11.51.40 (1).jpeg" alt="A couple in traditional clothing during a ceremony" loading="lazy">
        <img class="memory-photo" src="WhatsApp Image 2026-11-04 at 11.51.40 (2).jpeg" alt="A couple posing together beneath a flower arch" loading="lazy">
        <img class="memory-photo" src="WhatsApp Image 2026-11-04 at 11.51.40.jpeg" alt="A couple smiling together in traditional clothing" loading="lazy">
      </div>
      <button class="replay" id="replay" type="button" aria-label="Replay the fireworks">
        <span class="replay-icon" aria-hidden="true">&#8635;</span>
        Replay fireworks
      </button>
    </section>
    <p class="footer-note">Make a wish. The sky is listening.</p>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("sky");
      const context = canvas.getContext("2d");
      const replayButton = document.getElementById("replay");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const colors = ["#ff806f", "#ffd47c", "#8de0c1", "#fff1c8", "#f5a8bd"];
      let width = 0;
      let height = 0;
      let pixelRatio = 1;
      let rockets = [];
      let particles = [];
      let nextBurstAt = 0;
      let frameId = 0;

      function resize() {
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      }

      function launch() {
        if (reducedMotion.matches) return;
        const targetX = width * (.14 + Math.random() * .72);
        const targetY = height * (.12 + Math.random() * .42);
        const startX = targetX + (Math.random() - .5) * width * .16;
        const startY = height + 10;
        const distance = Math.hypot(targetX - startX, targetY - startY);
        const speed = 410 + Math.random() * 100;
        rockets.push({
          x: startX,
          y: startY,
          targetX,
          targetY,
          vx: (targetX - startX) / distance * speed,
          vy: (targetY - startY) / distance * speed,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }

      function burst(x, y, color) {
        const count = 48 + Math.floor(Math.random() * 28);
        for (let index = 0; index < count; index += 1) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 55 + Math.random() * 210;
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: .85 + Math.random() * .8,
            age: 0,
            radius: 1 + Math.random() * 1.8,
            color: Math.random() > .2 ? color : colors[Math.floor(Math.random() * colors.length)]
          });
        }
      }

      function draw(timestamp) {
        const now = timestamp / 1000;
        const delta = Math.min(.035, Math.max(.001, (timestamp - (draw.lastTimestamp || timestamp)) / 1000));
        draw.lastTimestamp = timestamp;
        context.clearRect(0, 0, width, height);

        if (now >= nextBurstAt) {
          launch();
          if (Math.random() > .62) window.setTimeout(launch, 260 + Math.random() * 260);
          nextBurstAt = now + 1.15 + Math.random() * 1.3;
        }

        rockets = rockets.filter((rocket) => {
          const dx = rocket.targetX - rocket.x;
          const dy = rocket.targetY - rocket.y;
          if (Math.hypot(dx, dy) < 14) {
            burst(rocket.x, rocket.y, rocket.color);
            return false;
          }
          rocket.x += rocket.vx * delta;
          rocket.y += rocket.vy * delta;
          context.beginPath();
          context.arc(rocket.x, rocket.y, 2, 0, Math.PI * 2);
          context.fillStyle = "#fff8ec";
          context.shadowBlur = 12;
          context.shadowColor = rocket.color;
          context.fill();
          context.shadowBlur = 0;
          return true;
        });

        particles = particles.filter((particle) => {
          particle.age += delta;
          if (particle.age >= particle.life) return false;
          particle.vx *= .986;
          particle.vy = particle.vy * .986 + 82 * delta;
          particle.x += particle.vx * delta;
          particle.y += particle.vy * delta;
          const opacity = 1 - particle.age / particle.life;
          context.globalAlpha = opacity;
          context.beginPath();
          context.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
          context.fillStyle = particle.color;
          context.shadowBlur = 9;
          context.shadowColor = particle.color;
          context.fill();
          context.shadowBlur = 0;
          return true;
        });
        context.globalAlpha = 1;
        frameId = window.requestAnimationFrame(draw);
      }

      function startCelebration() {
        if (reducedMotion.matches) return;
        launch();
        window.setTimeout(launch, 230);
        window.setTimeout(launch, 510);
        nextBurstAt = performance.now() / 1000 + 1.5;
      }

      resize();
      window.addEventListener("resize", resize, { passive: true });
      replayButton.addEventListener("click", startCelebration);

      if (reducedMotion.matches) {
        replayButton.disabled = true;
        replayButton.title = "Fireworks are off because reduced motion is enabled";
      } else {
        frameId = window.requestAnimationFrame(draw);
        startCelebration();
      }

      reducedMotion.addEventListener("change", () => {
        if (reducedMotion.matches) {
          window.cancelAnimationFrame(frameId);
          rockets = [];
          particles = [];
          replayButton.disabled = true;
        } else {
          replayButton.disabled = false;
          frameId = window.requestAnimationFrame(draw);
          startCelebration();
        }
      });
    })();
  </script>
</body>
</html>
